name: Probe election-night result files

# Temporary: checks which official result files answer and logs their layout (pipeline/scratch/live_probe/_log.txt).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/live_probe.py pipeline/scratch/live_probe/_log.txt
      - name: Save the log
        run: |
          git config user.name "midterm-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/scratch/live_probe
          git commit -m "Election-night file probe log" || exit 0
          git pull --rebase origin main
          git push
