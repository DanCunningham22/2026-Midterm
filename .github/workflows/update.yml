name: Update data and publish

on:
  schedule:
    - cron: '23 */3 * * *'    # every three hours at :23 (off the top of the hour, which GitHub often delays)
  workflow_dispatch:           # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', '.github/workflows/**']

permissions:
  contents: write   # commit the refreshed data.json
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned so the runner image does not change before Election Day
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always build the newest commit, even if this run was queued behind others

      - name: Rebuild data from the live feeds
        run: python3 pipeline/build.py --out site/data.json

      - name: Save the new data to the repository
        run: |
          git config user.name "midterm-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase -X theirs origin main && git push)
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned so the runner image does not change before Election Day
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
