name: Explore early-vote sources

# One-off research run: lists what the state election offices and the Wayback Machine hold for daily early-vote
# reports (2022, 2024, 2026) and commits small text summaries to pipeline/scratch/ev_explore/ for inspection.
on:
  workflow_dispatch:
    inputs:
      pass:
        description: "Which pass to run (explore or explore2)"
        default: "explore2"

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl
      - name: Explore
        run: python3 pipeline/ev_sources.py ${{ github.event.inputs.pass || 'explore2' }} pipeline/scratch/ev_explore
      - name: Commit the findings
        run: |
          git config user.name "midterm-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/scratch/ev_explore
          if git diff --cached --quiet; then echo "Nothing found."; exit 0; fi
          git commit -m "Early-vote source exploration (scratch)"
          git pull --rebase origin main
          git push
